name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-pypi-and-linux:
    name: Build Linux Executable & PyPI Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pyqt6
          python -m pip install --upgrade pip setuptools wheel build pyinstaller pillow
          python -m pip install .

      - name: Generate icon.ico
        run: |
          python -c "from PIL import Image; img = Image.open('livechat_desktop/assets/icons/wilson_maillard.png'); img.save('icon.ico')"

      - name: Build Python Package (sdist & wheel)
        run: |
          python -m build

      - name: Build Linux Executable
        run: |
          python -m PyInstaller --distpath bin \
            --noconfirm \
            --onefile \
            --windowed \
            --icon icon.ico \
            --name "livechat-desktop-linux" \
            --add-data "livechat_desktop/assets:livechat_desktop/assets" \
            --add-data "livechat_desktop/providers/scripts:livechat_desktop/providers/scripts" \
            livechat_desktop/__main__.py


      - name: Build Debian (.deb) Package
        run: |
          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/pixmaps
          
          # Copier le binaire
          cp bin/livechat-desktop-linux package/usr/bin/livechat-desktop
          chmod +x package/usr/bin/livechat-desktop
          
          # Copier l'icône
          cp livechat_desktop/assets/icons/wilson_maillard.png package/usr/share/pixmaps/livechat-desktop.png
          
          # Créer le fichier .desktop
          cat << 'DESKTOP' > package/usr/share/applications/livechat-desktop.desktop
          [Desktop Entry]
          Name=LiveChat Desktop
          Comment=A desktop overlay for LiveChat
          Exec=/usr/bin/livechat-desktop
          Icon=livechat-desktop.png
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP
          
          # Extraire la version du tag GitHub ou utiliser 1.0.0 par défaut
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == refs/* ]]; then VERSION="1.0.0"; fi
          
          # Créer le fichier control
          cat << CONTROL > package/DEBIAN/control
          Package: livechat-desktop
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Romain Guillon
          Description: A desktop overlay for LiveChat built with PyQt6
          CONTROL
          
          # Construire le .deb
          dpkg-deb --build package livechat-desktop_${VERSION}_amd64.deb
          mkdir -p bin
          mv livechat-desktop_${VERSION}_amd64.deb bin/
      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          overwrite_files: true
          files: |
            bin/livechat-desktop-linux
            bin/*.deb
            dist/*.whl
            dist/*.tar.gz

      - name: Publish package to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          skip-existing: true

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller pillow
          python -m pip install .

      - name: Generate icon.ico
        run: |
          python -c "from PIL import Image; img = Image.open('livechat_desktop/assets/icons/wilson_maillard.png'); img.save('icon.ico')"

      - name: Build Windows Executable (.exe)
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --icon icon.ico `
            --name "livechat-desktop-windows" `
            --add-data "livechat_desktop/assets;livechat_desktop/assets" `
            --add-data "livechat_desktop/providers/scripts;livechat_desktop/providers/scripts" `
            livechat_desktop/__main__.py

      - name: Upload Windows Executable to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          overwrite_files: true
          files: |
            dist/livechat-desktop-windows.exe
