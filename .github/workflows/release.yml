name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-pypi-and-linux:
    name: Build Linux Executable & PyPI Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pyqt6
          python -m pip install --upgrade pip setuptools wheel build pyinstaller pillow
          python -m pip install .

      - name: Generate icon.ico
        run: |
          python -c "from PIL import Image; img = Image.open('livechat_desktop/assets/icons/romain_guillon.jpg'); img.save('icon.ico')"

      - name: Build Python Package (sdist & wheel)
        run: |
          python -m build

      - name: Build Linux Executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --onefile \
            --windowed \
            --icon icon.ico \
            --name "livechat-desktop-linux" \
            --add-data "livechat_desktop/assets:livechat_desktop/assets" \
            --add-data "livechat_desktop/providers/scripts:livechat_desktop/providers/scripts" \
            livechat_desktop/__main__.py

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          overwrite_files: true
          files: |
            dist/livechat-desktop-linux
            dist/*.whl
            dist/*.tar.gz

      - name: Publish package to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          skip-existing: true

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller pillow
          python -m pip install .

      - name: Generate icon.ico
        run: |
          python -c "from PIL import Image; img = Image.open('livechat_desktop/assets/icons/romain_guillon.jpg'); img.save('icon.ico')"

      - name: Build Windows Executable (.exe)
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --icon icon.ico `
            --name "livechat-desktop-windows" `
            --add-data "livechat_desktop/assets;livechat_desktop/assets" `
            --add-data "livechat_desktop/providers/scripts;livechat_desktop/providers/scripts" `
            livechat_desktop/__main__.py

      - name: Upload Windows Executable to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          overwrite_files: true
          files: |
            dist/livechat-desktop-windows.exe
